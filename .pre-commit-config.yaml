ci:
  autofix_commit_msg: "ci(pre-commit): autofix"
  autoupdate_commit_msg: "ci(pre-commit): quarterly autoupdate"
  autoupdate_schedule: quarterly

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-json
      - id: check-merge-conflict
      - id: check-toml
      - id: check-xml
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]

  - repo: https://github.com/igorshubovych/markdownlint-cli
    # Pinned: v0.48.0 requires Node ^24.12, but pre-commit.ci ships v24.9.0 (EBADENGINE).
    rev: v0.49.0
    hooks:
      - id: markdownlint
        args: [-c, .markdownlint.yaml, --fix]

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.13.1-1
    hooks:
      - id: shfmt
        args: [-w, -s, -i=4]

  - repo: https://github.com/biomejs/pre-commit
    rev: v2.5.2
    hooks:
      - id: biome-check

  - repo: local
    hooks:
      # Mirrors .pre-commit-hooks.yaml. `language: script` (not `node`) because since
      # pre-commit 4.6.1 a `repo: local` node hook requires additional_dependencies,
      # and this script only uses the Node standard library.
      - id: format-cspell-json
        name: format cspell.json
        description: Sort and format .cspell.json.
        entry: scripts/format_cspell_json.mjs
        language: script
        files: \.cspell\.json$

exclude: .svg
